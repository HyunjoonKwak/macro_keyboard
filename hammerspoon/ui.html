<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K20 스트림덱 설정</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101116;
      --panel: #191b23;
      --panel-2: #20232d;
      --key: #292d39;
      --key-hover: #343a49;
      --line: #383d4a;
      --text: #f2f4f8;
      --muted: #9299a8;
      --accent: #7c8cff;
      --accent-soft: rgba(124, 140, 255, .18);
      --danger: #ff6f7d;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--text); font-size: 14px; }
    button, input, select, textarea { font: inherit; }
    button, select, input, textarea {
      color: var(--text);
      background: #242731;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    button { cursor: pointer; }
    button:hover { border-color: #596174; }

    .app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 18px 11px;
      border-bottom: 1px solid var(--line);
      background: rgba(20, 22, 28, .96);
    }

    .tabs { display: flex; flex: 1; gap: 7px; min-width: 0; overflow-x: auto; }
    .tab-wrap { position: relative; display: flex; flex: 0 0 auto; }
    .tab {
      padding: 8px 13px;
      border-radius: 9px;
      background: transparent;
      border-color: transparent;
      white-space: nowrap;
    }
    .tab.active { padding-right: 34px; background: var(--accent-soft); border-color: var(--accent); }
    .tab-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; }
    .icon-picker { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; margin-top: 8px; max-height: 132px; overflow-y: auto; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: #1c1e27; }
    .icon-picker button { padding: 3px 0; font-size: 16px; line-height: 1.3; background: transparent; border: 1px solid transparent; border-radius: 6px; }
    .icon-picker button:hover { background: var(--key-hover); border-color: var(--line); }
    .app-pick-list { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; max-height: 260px; overflow-y: auto; }
    .app-pick-list button { padding: 7px 9px; font-size: 12px; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .image-row { display: flex; align-items: center; gap: 8px; }
    .image-row img { width: 34px; height: 34px; border-radius: 7px; object-fit: contain; background: #1c1e27; border: 1px solid var(--line); }
    .image-row button { padding: 7px 11px; font-size: 12px; }
    .secondary-actions { margin-top: 12px; }
    .secondary-actions button { font-weight: 500; font-size: 12px; padding: 7px; }
    .key-img { width: 20px; height: 20px; object-fit: contain; }
    .widget-panel { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--line); }
    .widget-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-bottom: 12px; }
    .widget-controls select { width: 100%; padding: 8px 10px; }
    .widget-panel input[type="range"] { width: 100%; }
    .tab-more {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 28px;
      height: calc(100% - 6px);
      padding: 0;
      border-color: transparent;
      background: transparent;
      color: #c6cafa;
    }
    .tab-add {
      flex: 0 0 auto;
      min-width: 36px;
      padding: 7px 11px;
      border-color: #4a5060;
      background: transparent;
      color: var(--accent);
      font-size: 18px;
      line-height: 1;
    }
    .header-controls { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .header-button { padding: 8px 11px; background: transparent; }
    .profile-wrap { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .profile-wrap label { color: var(--muted); font-size: 12px; }
    #profileSelect { min-width: 175px; padding: 8px 30px 8px 10px; }
    .layer-menu {
      position: fixed;
      z-index: 30;
      width: 142px;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #232630;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .4);
    }
    .layer-menu[hidden] { display: none; }
    .layer-menu button {
      display: block;
      width: 100%;
      padding: 8px 9px;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .layer-menu button:hover { background: #303440; }
    .layer-menu button:disabled { cursor: default; opacity: .35; }
    .layer-menu .danger { color: var(--danger); }

    main {
      display: grid;
      grid-template-columns: minmax(490px, 1fr) 315px;
      min-height: 0;
    }

    .keypad-area {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 18px;
      background:
        radial-gradient(circle at 50% 45%, rgba(124, 140, 255, .07), transparent 55%),
        var(--bg);
    }

    .keypad {
      width: min(100%, 530px);
      height: min(100%, 510px);
      display: grid;
      grid-template-columns: repeat(4, minmax(82px, 1fr));
      grid-template-rows: repeat(6, minmax(57px, 1fr));
      gap: 9px;
      padding: 15px;
      border: 1px solid #303440;
      border-radius: 20px;
      background: #171920;
      box-shadow: 0 18px 55px rgba(0, 0, 0, .32);
    }

    .key {
      position: relative;
      min-width: 0;
      padding: 18px 7px 8px;
      overflow: hidden;
      border: 1px solid #3b404d;
      border-bottom-color: #171920;
      border-radius: 11px;
      background: linear-gradient(145deg, #303440, #242731);
      box-shadow: inset 0 1px rgba(255,255,255,.04), 0 3px 0 #111218;
      color: var(--text);
    }
    .key:not(.disabled):not(.switch):hover { background: var(--key-hover); transform: translateY(-1px); }
    .key.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), 0 3px 0 #111218; }
    .key.inherited .key-content::after { content: "공통"; display: block; color: var(--accent); font-size: 9px; margin-top: 3px; }
    .engraving { position: absolute; top: 7px; left: 9px; color: #aab0bd; font-size: 10px; font-weight: 650; }
    .key-content { display: grid; place-items: center; align-content: center; height: 100%; line-height: 1.18; text-align: center; }
    .key-icon { min-height: 20px; font-size: 20px; }
    .key-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 12px; font-weight: 650; }
    .key-id { color: #6f7685; font-family: ui-monospace, monospace; font-size: 8px; margin-top: 4px; }
    .key.unassigned .key-label { color: #6f7685; font-weight: 500; }
    .key.disabled { cursor: not-allowed; border-style: dashed; background: transparent; box-shadow: none; opacity: .48; }
    .key.switch { cursor: default; border-color: #645f3e; background: linear-gradient(145deg, #403d29, #29281f); box-shadow: 0 3px 0 #12120f; }
    .key.switch .key-label { color: #f3d779; }

    aside {
      min-height: 0;
      padding: 18px;
      overflow-y: auto;
      border-left: 1px solid var(--line);
      background: var(--panel);
    }
    aside h2 { margin: 0 0 4px; font-size: 17px; }
    #selectionHint { min-height: 18px; margin-bottom: 16px; color: var(--muted); font-size: 11px; }
    .field { margin-bottom: 13px; }
    .field > label, .field-label { display: block; margin-bottom: 6px; color: #b9bfca; font-size: 11px; font-weight: 650; }
    .field input, .field select, .field textarea { width: 100%; padding: 9px 10px; outline: none; }
    .field textarea { min-height: 72px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .action-help { min-height: 32px; margin: 7px 2px 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .dynamic { display: none; }
    .dynamic.visible { display: block; }
    .modifiers { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
    .check { display: flex; align-items: center; gap: 7px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; }
    .check input { width: auto; margin: 0; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
    .actions button { padding: 10px; font-weight: 700; }
    #saveButton { background: var(--accent); border-color: var(--accent); color: white; }
    #clearButton { color: var(--danger); background: transparent; }
    .empty-editor { color: var(--muted); line-height: 1.6; }
    .editor-form[hidden], .empty-editor[hidden] { display: none; }
    .status { position: fixed; left: 18px; bottom: 12px; color: var(--muted); font-size: 11px; pointer-events: none; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      padding: 28px;
      background: rgba(5, 6, 9, .72);
      backdrop-filter: blur(5px);
    }
    .modal-overlay[hidden] { display: none; }
    .modal {
      width: min(680px, 100%);
      max-height: min(590px, 100%);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .5);
    }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .modal-header h2 { margin: 0; font-size: 18px; }
    .modal-close { width: 32px; height: 32px; padding: 0; background: transparent; font-size: 18px; }
    .modal-body { max-height: 520px; padding: 18px; overflow-y: auto; }
    .preset-list { display: grid; gap: 11px; }
    .preset-card { padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); }
    .preset-card h3 { margin: 0 0 5px; font-size: 15px; }
    .preset-card p { margin: 0; color: var(--muted); line-height: 1.45; }
    .preset-actions { display: flex; gap: 8px; margin-top: 12px; }
    .preset-actions button { padding: 8px 10px; }
    .preset-actions button:first-child { border-color: var(--accent); color: #d8dcff; }
    .guide { color: #d9dde6; line-height: 1.65; }
    .guide h3 { margin: 18px 0 6px; color: white; font-size: 14px; }
    .guide h3:first-child { margin-top: 0; }
    .guide p { margin: 0 0 9px; }
    .guide strong { color: #bfc6ff; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <nav class="tabs" id="layerTabs" aria-label="레이어"></nav>
      <div class="header-controls">
        <button class="header-button" type="button" id="presetButton">프리셋</button>
        <button class="header-button" type="button" id="helpButton">도움말</button>
        <div class="profile-wrap">
          <label for="profileSelect">프로필</label>
          <select id="profileSelect"></select>
        </div>
      </div>
    </header>

    <main>
      <section class="keypad-area">
        <div class="keypad" id="keypad" aria-label="K20 키패드"></div>
      </section>

      <aside>
        <div class="empty-editor" id="emptyEditor">편집할 키를 선택하세요.<br>점선 키와 레이어 전환 키는 편집할 수 없습니다.</div>
        <form class="editor-form" id="editorForm" hidden onsubmit="return false;">
          <h2 id="editorTitle">키 설정</h2>
          <div id="selectionHint"></div>

          <div class="field">
            <label for="actionType">동작</label>
            <select id="actionType">
              <option value="none">없음</option>
              <option value="app">앱 실행</option>
              <option value="url">URL 열기</option>
              <option value="keys">키 조합</option>
              <option value="text">텍스트 입력</option>
              <option value="shell">셸 명령</option>
              <option value="shortcut">단축어 실행</option>
              <option value="media">미디어</option>
              <option value="mic">마이크 토글</option>
              <option value="layer">레이어 이동</option>
              <option value="multi">매크로 (연속 실행)</option>
            </select>
            <p class="action-help" id="actionHelp"></p>
          </div>

          <div class="dynamic field" data-for="app">
            <label for="appArg">앱 이름 (입력하면 설치된 앱 목록이 뜹니다)</label>
            <input id="appArg" type="text" placeholder="예: Google Chrome" list="appList">
          </div>
          <datalist id="appList"></datalist>
          <div class="dynamic field" data-for="url">
            <label for="urlArg">URL</label>
            <input id="urlArg" type="url" placeholder="https://example.com">
          </div>
          <div class="dynamic field" data-for="text">
            <label for="textArg">입력할 텍스트</label>
            <textarea id="textArg"></textarea>
          </div>
          <div class="dynamic field" data-for="shell">
            <label for="shellArg">셸 명령</label>
            <textarea id="shellArg" spellcheck="false"></textarea>
          </div>
          <div class="dynamic field" data-for="shortcut">
            <label for="shortcutArg">macOS 단축어 이름</label>
            <input id="shortcutArg" type="text">
          </div>
          <div class="dynamic" data-for="keys">
            <div class="field">
              <span class="field-label">보조 키</span>
              <div class="modifiers">
                <label class="check"><input type="checkbox" name="mod" value="cmd">⌘ cmd</label>
                <label class="check"><input type="checkbox" name="mod" value="alt">⌥ alt</label>
                <label class="check"><input type="checkbox" name="mod" value="ctrl">⌃ ctrl</label>
                <label class="check"><input type="checkbox" name="mod" value="shift">⇧ shift</label>
              </div>
            </div>
            <div class="field">
              <label for="keyArg">키</label>
              <input id="keyArg" type="text" placeholder="예: t, space, `">
            </div>
          </div>
          <div class="dynamic field" data-for="layer">
            <label for="layerArg">이동할 레이어</label>
            <select id="layerArg"></select>
          </div>
          <div class="dynamic field" data-for="multi">
            <label for="multiArg">매크로 단계 (한 줄에 하나씩, 위에서 아래로 실행)</label>
            <textarea id="multiArg" spellcheck="false" style="min-height:110px" placeholder="app:Google Chrome
delay:0.5
keys:cmd+t
text:claude.ai
keys:return"></textarea>
            <p class="action-help">사용 가능: app:이름 · url:주소 · keys:cmd+shift+t · text:문구 ·
shell:명령 · shortcut:단축어 · media:PLAY · mic · delay:0.5(초)</p>
          </div>
          <div class="dynamic field" data-for="media">
            <label for="mediaArg">미디어 동작</label>
            <select id="mediaArg">
              <option value="PLAY">재생 / 일시정지</option>
              <option value="PREVIOUS">이전 곡</option>
              <option value="NEXT">다음 곡</option>
              <option value="SOUND_UP">볼륨 크게</option>
              <option value="SOUND_DOWN">볼륨 작게</option>
              <option value="MUTE">음소거</option>
            </select>
          </div>

          <div class="field">
            <label for="labelArg">표시 이름</label>
            <input id="labelArg" type="text" placeholder="키에 표시할 이름">
          </div>
          <div class="field">
            <label for="iconArg">아이콘 (이모지 1개)</label>
            <input id="iconArg" type="text" placeholder="예: 🚀">
            <div class="icon-picker" id="iconPicker"></div>
          </div>
          <div class="field">
            <label for="holdArg">길게 누르기 동작 (선택)</label>
            <input id="holdArg" type="text" placeholder="예: keys:cmd+q 또는 app:Slack; delay:0.3; text:hi">
            <p class="action-help">0.45초 이상 누르면 이 동작, 짧게 누르면 위의 기본 동작. 여러 개는 ;로 구분</p>
          </div>
          <div class="field">
            <span class="field-label">이미지 아이콘 (이모지 대신 사용)</span>
            <div class="image-row">
              <img id="imagePreview" alt="" hidden>
              <button type="button" id="pickImageButton">이미지 선택…</button>
              <button type="button" id="clearImageButton" hidden>제거</button>
            </div>
          </div>
          <div class="actions secondary-actions">
            <button type="button" id="copyButton">키 복사</button>
            <button type="button" id="pasteButton" disabled>붙여넣기</button>
          </div>
          <div class="actions">
            <button type="button" id="saveButton">저장</button>
            <button type="button" id="clearButton">할당 해제</button>
          </div>
        </form>

        <div class="widget-panel">
          <div class="field-label">데스크톱 위젯</div>
          <div class="widget-controls">
            <select id="widgetMode" aria-label="위젯 모드">
              <option value="hidden">숨김</option>
              <option value="compact">컴팩트</option>
              <option value="expanded">확장</option>
            </select>
            <select id="widgetLevel" aria-label="위젯 표시 레벨">
              <option value="top">항상 위</option>
              <option value="desktop">데스크톱 고정</option>
            </select>
          </div>
          <label class="field-label" for="widgetAlpha">불투명도 <span id="widgetAlphaOut"></span></label>
          <input type="range" id="widgetAlpha" min="30" max="100" step="5" value="94">
        </div>
      </aside>
    </main>
  </div>
  <div class="status" id="status">설정을 불러오는 중…</div>
  <div class="layer-menu" id="layerMenu" hidden>
    <button type="button" data-layer-action="rename">이름 변경</button>
    <button type="button" data-layer-action="color">색상 변경</button>
    <button type="button" data-layer-action="appLink">앱 연결…</button>
    <button type="button" data-layer-action="left">← 이동</button>
    <button type="button" data-layer-action="right">→ 이동</button>
    <button type="button" class="danger" data-layer-action="delete">삭제</button>
  </div>
  <input type="color" id="layerColorInput" style="position:fixed; left:-100px; top:-100px; width:1px; height:1px; opacity:0;">
  <div class="modal-overlay" id="modalOverlay" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle"></h2>
        <button class="modal-close" type="button" id="modalClose" aria-label="닫기">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </section>
  </div>

  <script>
    (() => {
      "use strict";

      const PHYSICAL_KEYS = [
        { engraving: "Esc", id: "hyper+f19", row: 1, col: 1 },
        { engraving: "Tab", id: "hyper+f20", row: 1, col: 2 },
        { engraving: "⌫", id: "s-hyper+f13", row: 1, col: 3 },
        { engraving: "Fn", disabled: true, row: 1, col: 4 },
        { engraving: "Num", disabled: true, row: 2, col: 1 },
        { engraving: "/", id: "hyper+f14", row: 2, col: 2 },
        { engraving: "*", id: "hyper+f15", row: 2, col: 3 },
        { engraving: "-", id: "hyper+f16", row: 2, col: 4 },
        { engraving: "7", id: "f13", row: 3, col: 1 },
        { engraving: "8", id: "f14", row: 3, col: 2 },
        { engraving: "9", id: "f15", row: 3, col: 3 },
        { engraving: "+", switch: true, row: 3, col: 4, rowSpan: 2 },
        { engraving: "4", id: "f16", row: 4, col: 1 },
        { engraving: "5", id: "f17", row: 4, col: 2 },
        { engraving: "6", id: "f18", row: 4, col: 3 },
        { engraving: "1", id: "f19", row: 5, col: 1 },
        { engraving: "2", id: "f20", row: 5, col: 2 },
        { engraving: "3", id: "s-hyper+f17", row: 5, col: 3 },
        { engraving: "Enter", id: "s-hyper+f20", row: 5, col: 4, rowSpan: 2 },
        { engraving: "0", id: "s-hyper+f18", row: 6, col: 1, colSpan: 2 },
        { engraving: ".", id: "s-hyper+f19", row: 6, col: 3 }
      ];
      const ARG_FIELDS = {
        app: "appArg", url: "urlArg", text: "textArg",
        shell: "shellArg", shortcut: "shortcutArg"
      };
      const ACTION_HELP = {
        none: "이 키의 동작을 비웁니다. 예: 미할당 상태",
        app: "앱을 실행하거나 앞으로 가져옵니다. 예: Google Chrome",
        url: "웹 주소를 기본 브라우저로 엽니다. 예: https://example.com",
        keys: "보조 키와 일반 키를 함께 누릅니다. 예: cmd + shift + 4",
        text: "현재 입력 위치에 문구를 입력합니다. 예: 이메일 주소",
        shell: "터미널 명령을 실행합니다. 예: git pull",

      function renderTabs() {
        const tabs = $("layerTabs");
        tabs.replaceChildren();
        keymap.layers.forEach((layer, index) => {
          const wrap = document.createElement("div");
          wrap.className = "tab-wrap";
          const button = document.createElement("button");
          button.className = "tab" + (index === layerIndex ? " active" : "");
          button.type = "button";
          if (layer.color) {
            const dot = document.createElement("span");
            dot.className = "tab-dot";
            dot.style.background = layer.color;
            button.appendChild(dot);
          }
          button.appendChild(document.createTextNode(
            layer.name + (layer.appTrigger ? " ⇄" : "")));
          if (layer.appTrigger) button.title = layer.appTrigger + " 활성화 시 자동 전환";
          button.addEventListener("click", () => {
            closeLayerMenu();
            if (layerIndex === index) return;
            layerIndex = index;
            profileName = "default";
            selectedId = null;
            renderAll();
          });
          button.addEventListener("dblclick", event => {
            event.preventDefault();
            if (layerIndex !== index) {
              layerIndex = index;
              profileName = "default";
              selectedId = null;
              renderAll();
            }
            openLayerMenu(index, $("layerTabs").querySelector(".tab.active"));
          });
          wrap.appendChild(button);
          if (index === layerIndex) {
            const more = document.createElement("button");
            more.className = "tab-more";
            more.type = "button";
            more.textContent = "⋯";
            more.setAttribute("aria-label", `${layer.name} 레이어 메뉴`);
            more.addEventListener("click", event => {
              event.stopPropagation();
              openLayerMenu(index, more);
            });
            wrap.appendChild(more);
          }
          tabs.appendChild(wrap);
        });
        const add = document.createElement("button");
        add.className = "tab-add";
        add.type = "button";
        add.textContent = "+";
        add.setAttribute("aria-label", "레이어 추가");
        add.addEventListener("click", addLayer);
        tabs.appendChild(add);
      }

      function addLayer() {
        closeLayerMenu();
        textPrompt("새 레이어 이름", "", name => {
          keymap.layers.push({ name, profiles: { default: {} } });
          layerIndex = keymap.layers.length - 1;
          profileName = "default";
          selectedId = null;
          renderAll();
          saveKeymap();
        });
      }

      function openLayerMenu(index, anchor) {
        layerMenuIndex = index;
        const menu = $("layerMenu");
        const rect = anchor.getBoundingClientRect();
        menu.hidden = false;
        menu.style.left = `${Math.min(rect.left, window.innerWidth - 152)}px`;
        menu.style.top = `${Math.min(rect.bottom + 5, window.innerHeight - menu.offsetHeight - 8)}px`;
        menu.querySelector('[data-layer-action="left"]').disabled = index === 0;
        menu.querySelector('[data-layer-action="right"]').disabled = index === keymap.layers.length - 1;
      }

      function closeLayerMenu() {
        $("layerMenu").hidden = true;
        layerMenuIndex = null;
      }

      function handleLayerAction(action) {
        if (layerMenuIndex === null || !keymap.layers[layerMenuIndex]) return;

        const layer = keymap.layers[index];
        if (action === "rename") {
          closeLayerMenu();
          textPrompt("레이어 이름 변경", layer.name, name => {
            layer.name = name;
            renderAll();
            saveKeymap();
          });
          return;
        } else if (action === "color") {
          const input = $("layerColorInput");
          input.value = layer.color || "#20232d";
          colorLayerIndex = index;
          closeLayerMenu();
          input.click();
          return;
        } else if (action === "appLink") {
          closeLayerMenu();
          pickApp("레이어 앱 연결 — " + layer.name, layer.appTrigger || "", name => {
            layer.appTrigger = name;
            renderAll();
            saveKeymap();
          }, layer.appTrigger ? () => {
            delete layer.appTrigger;
            renderAll();
            saveKeymap();
          } : null);
          return;
        } else if (action === "left" && index > 0) {
          [keymap.layers[index - 1], keymap.layers[index]] = [keymap.layers[index], keymap.layers[index - 1]];
          layerIndex = index - 1;
        } else if (action === "right" && index < keymap.layers.length - 1) {
          [keymap.layers[index], keymap.layers[index + 1]] = [keymap.layers[index + 1], keymap.layers[index]];
          layerIndex = index + 1;
        } else if (action === "delete") {
          closeLayerMenu();
          if (keymap.layers.length === 1) {
            alertModal("마지막 레이어는 삭제할 수 없습니다.");
            return;
          }
          confirmModal("레이어 삭제", `"${layer.name}" 레이어를 삭제할까요?`, () => {
            keymap.layers.splice(index, 1);
            layerIndex = Math.min(index, keymap.layers.length - 1);
            profileName = "default";
            selectedId = null;
            renderAll();
            saveKeymap();
          });
          return;
        } else {
          return;
        }
        closeLayerMenu();
        renderAll();
        saveKeymap();
      }

      function uniqueLayerName(baseName) {
        const names = new Set(keymap.layers.map(layer => layer.name));
        if (!names.has(baseName)) return baseName;
        let suffix = 2;
        while (names.has(`${baseName} ${suffix}`)) suffix += 1;
        return `${baseName} ${suffix}`;
      }

      function textPrompt(title, initial, onConfirm) {
        openModal(title);
        const body = $("modalBody");
        const input = document.createElement("input");
        input.type = "text";
        input.value = initial || "";
        input.style.cssText = "width:100%; padding:9px 10px;";

        input.addEventListener("keydown", event => { if (event.key === "Enter") submit(); });

      function fallbackLabel(spec) {
        if (spec.type === "mic") return "마이크";
        if (spec.type === "layer") return "→ " + (spec.arg || "");
        if (spec.type === "multi") return `매크로(${(spec.steps || []).length})`;
        if (spec.type === "keys") return [...(spec.mods || []), spec.key || ""].filter(Boolean).join("+");
        return spec.arg || spec.type || "할당됨";
      }

      const stepToLine = step => {
        if (step.type === "delay") return "delay:" + step.seconds;
        if (step.type === "mic") return "mic";
        if (step.type === "keys") return "keys:" + [...(step.mods || []), step.key].join("+");
        return step.type + ":" + (step.arg || "");
      };

      const VALID_MODS = new Set(["cmd", "alt", "ctrl", "shift"]);
      function parseSteps(textValue) {
        const lines = textValue.split("\n").map(line => line.trim()).filter(Boolean);
        if (!lines.length) throw new Error("매크로 단계를 1줄 이상 입력해 주세요.");
        return lines.map((line, i) => {
          const at = `${i + 1}번째 줄`;
          if (line === "mic") return { type: "mic" };
          const sep = line.indexOf(":");
          if (sep < 1) throw new Error(`${at}: "종류:값" 형식이 아닙니다 — ${line}`);
          const kind = line.slice(0, sep).trim().toLowerCase();
          const value = line.slice(sep + 1).trim();
          if (kind === "delay" || kind === "지연") {
            const seconds = Number(value);
            if (!(seconds >= 0 && seconds <= 60)) throw new Error(`${at}: 지연은 0~60초 사이 숫자`);
            return { type: "delay", seconds };
          }
          if (kind === "keys") {
            const parts = value.split("+").map(part => part.trim()).filter(Boolean);
            const key = parts.pop();
            if (!key) throw new Error(`${at}: 키가 없습니다`);
            const bad = parts.find(mod => !VALID_MODS.has(mod));
            if (bad) throw new Error(`${at}: 알 수 없는 보조 키 "${bad}"`);
            return { type: "keys", mods: parts, key };
          }
          if (kind === "media") {
            const upper = value.toUpperCase();
            if (!["PLAY","PREVIOUS","NEXT","SOUND_UP","SOUND_DOWN","MUTE"].includes(upper))
              throw new Error(`${at}: media 값은 PLAY/PREVIOUS/NEXT/SOUND_UP/SOUND_DOWN/MUTE`);
            return { type: "media", arg: upper };
          }
          if (["app", "url", "text", "shell", "shortcut", "layer"].includes(kind)) {
            if (!value) throw new Error(`${at}: 값이 비어 있습니다`);
            return { type: kind, arg: value };
          }
          throw new Error(`${at}: 알 수 없는 종류 "${kind}"`);
        });
      }

      function selectKey(id, engraving) {
        selectedId = id;
        $("emptyEditor").hidden = true;
        $("editorForm").hidden = false;
        $("editorTitle").textContent = `${engraving} 키 설정`;
        const inherited = profileName !== "default" && !ownSpec(id) && currentLayer().profiles.default[id];
        $("selectionHint").textContent = `${id}${inherited ? " · 현재 공통 설정을 사용 중" : ""}`;
        fillEditor(ownSpec(id));
        renderKeypad();
      }

      function fillEditor(spec) {
        const type = spec ? spec.type : "none";
        $("actionType").value = type;
        Object.values(ARG_FIELDS).forEach(id => { $(id).value = ""; });
        $("keyArg").value = "";
        $("mediaArg").value = "PLAY";
        document.querySelectorAll('input[name="mod"]').forEach(input => { input.checked = false; });
        $("labelArg").value = spec && spec.label ? spec.label : "";
        $("iconArg").value = spec && spec.icon ? spec.icon : "";
        const layerSelect = $("layerArg");
        layerSelect.replaceChildren();
        keymap.layers.forEach(l => {
          const option = document.createElement("option");
          option.value = l.name;
          option.textContent = l.name;
          layerSelect.appendChild(option);
        });
        if (spec && type === "layer" && spec.arg) {
          if (![...layerSelect.options].some(option => option.value === spec.arg)) {
            const missing = document.createElement("option");
            missing.value = spec.arg;
            missing.textContent = spec.arg + " (삭제됨)";
            layerSelect.appendChild(missing);
          }
          layerSelect.value = spec.arg;
        }
        $("multiArg").value = "";
        $("holdArg").value = spec && spec.hold
          ? (spec.hold.type === "multi"
              ? (spec.hold.steps || []).map(stepToLine).join("; ")
              : stepToLine(spec.hold))
          : "";
        setEditorImage(spec && spec.image ? spec.image : null);
        if (spec) {
          if (ARG_FIELDS[type]) $(ARG_FIELDS[type]).value = spec.arg || "";
          if (type === "keys") {
            $("keyArg").value = spec.key || "";
            const mods = new Set(spec.mods || []);
            document.querySelectorAll('input[name="mod"]').forEach(input => { input.checked = mods.has(input.value); });
          }
          if (type === "media") $("mediaArg").value = spec.arg || "PLAY";
          if (type === "multi") $("multiArg").value = (spec.steps || []).map(stepToLine).join("\n");
        }
        updateDynamicFields();
      }

      let editorImage = null;
      function setEditorImage(path) {
        editorImage = path || null;
        const preview = $("imagePreview");
        if (editorImage) {
          preview.src = editorImage;
          preview.hidden = false;
          $("clearImageButton").hidden = false;
        } else {
          preview.removeAttribute("src");
          preview.hidden = true;
          $("clearImageButton").hidden = true;
        }
      }

      function updateDynamicFields() {
        const type = $("actionType").value;
        document.querySelectorAll(".dynamic").forEach(element => {
          element.classList.toggle("visible", element.dataset.for === type);
        });
        $("actionHelp").textContent = ACTION_HELP[type] || "";
      }

      function buildSpec() {
        const type = $("actionType").value;
        if (type === "none") return null;
        const spec = { type };
        if (ARG_FIELDS[type]) {
          const arg = $(ARG_FIELDS[type]).value;
          if (!arg) throw new Error("동작 값을 입력해 주세요.");
          spec.arg = arg;
        } else if (type === "keys") {
          spec.mods = Array.from(document.querySelectorAll('input[name="mod"]:checked')).map(input => input.value);
          spec.key = $("keyArg").value.trim();
          if (!spec.key) throw new Error("키를 입력해 주세요.");
        } else if (type === "media") {
          spec.arg = $("mediaArg").value;
        } else if (type === "layer") {
          spec.arg = $("layerArg").value;
          if (!spec.arg) throw new Error("이동할 레이어를 선택해 주세요.");
        } else if (type === "multi") {
          spec.steps = parseSteps($("multiArg").value);
        }
        const label = $("labelArg").value.trim();
        const icon = $("iconArg").value.trim();
        if (label) spec.label = label;
        if (icon) spec.icon = icon;
        if (editorImage) spec.image = editorImage;
        const holdText = $("holdArg").value.trim();
        if (holdText) {
          const steps = parseSteps(holdText.split(";").map(part => part.trim()).filter(Boolean).join("\n"));
          if (steps.length === 1) {
            if (steps[0].type === "delay") throw new Error("길게 누르기: 지연만으로는 동작이 안 됩니다.");
            spec.hold = steps[0];
          } else {
            spec.hold = { type: "multi", steps };
          }
        }
        return spec;
      }

      function saveSelection() {
        if (!selectedId) return;
        try {
          const spec = buildSpec();
          if (spec) currentProfile()[selectedId] = spec;
          else delete currentProfile()[selectedId];
          renderKeypad();
          fillEditor(currentProfile()[selectedId] || null);
          saveKeymap();
        } catch (error) {
          alertModal(error.message);
        }
      }

      function clearSelection() {
        if (!selectedId) return;
        delete currentProfile()[selectedId];
        renderKeypad();
        fillEditor(null);
        saveKeymap();
      }

      function renderEditor() {
        if (!selectedId) {
          $("emptyEditor").hidden = false;
          $("editorForm").hidden = true;
        }
      }

      function renderAll() {
        renderTabs();
        renderProfiles();
        renderKeypad();
        renderEditor();
      }

      $("actionType").addEventListener("change", updateDynamicFields);
      $("saveButton").addEventListener("click", saveSelection);

        "🎬", "🎮", "🎧", "📻", "📺", "🎨", "📷", "📸",
        "⚙️", "🔒", "🔓", "🌙", "☀️", "🔋", "📶", "🔌",
        "✂️", "📋", "🔍", "🌐", "⭐", "🔖", "🏠", "🏢",
        "✅", "❌", "⚠️", "🔥", "💡", "❤️", "👍", "🙏",
        "🤖", "🧠", "📝", "📊", "📅", "⏰", "☕", "🍀",
      ];
      const iconPicker = $("iconPicker");
      ICON_PALETTE.forEach(emoji => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = emoji;
        button.setAttribute("aria-label", "아이콘 " + emoji);
        button.addEventListener("click", () => { $("iconArg").value = emoji; });
        iconPicker.appendChild(button);
      });

      $("pickImageButton").addEventListener("click", () => bridge({ action: "pickImage" }));
      $("clearImageButton").addEventListener("click", () => setEditorImage(null));
      window.k20ReceiveIcon = path => {
        if (typeof path === "string" && path) setEditorImage(path);
      };

      window.k20ReceiveAppIcons = map => {
        appIcons = (map && !Array.isArray(map)) ? map : {};
        if (keymap) renderKeypad();
      };

      window.k20ReceiveAppList = names => {
        installedAppList = Array.isArray(names) ? names : [];
        const datalist = $("appList");
        datalist.replaceChildren();
        installedAppList.forEach(name => {
          const option = document.createElement("option");
          option.value = name;
          datalist.appendChild(option);
        });
      };

      let copiedSpec = null;
      $("copyButton").addEventListener("click", () => {
        if (!selectedId) return;
        const spec = ownSpec(selectedId);
        if (!spec) { $("status").textContent = "복사할 설정이 없습니다."; return; }
        copiedSpec = clone(spec);
        $("pasteButton").disabled = false;
        $("status").textContent = "키 설정을 복사했습니다. 다른 키를 선택하고 붙여넣기.";
      });
      $("pasteButton").addEventListener("click", () => {
        if (!selectedId || !copiedSpec) return;
        currentProfile()[selectedId] = clone(copiedSpec);
        renderKeypad();
        fillEditor(currentProfile()[selectedId]);
        saveKeymap();
      });

      $("layerColorInput").addEventListener("change", event => {
        if (colorLayerIndex === null || !keymap.layers[colorLayerIndex]) return;
        keymap.layers[colorLayerIndex].color = event.target.value;
        colorLayerIndex = null;
        renderAll();
        saveKeymap();
      });

      const sendWidgetConfig = () => {
        bridge({ action: "widget", config: {
          mode: $("widgetMode").value,
          level: $("widgetLevel").value,
          alpha: Number($("widgetAlpha").value) / 100,
        } });
      };
      $("widgetMode").addEventListener("change", sendWidgetConfig);
      $("widgetLevel").addEventListener("change", sendWidgetConfig);
      $("widgetAlpha").addEventListener("input", () => {
        $("widgetAlphaOut").textContent = $("widgetAlpha").value + "%";
      });
      $("widgetAlpha").addEventListener("change", sendWidgetConfig);

      window.k20ReceiveWidgetConfig = config => {
        if (!config) return;
        if (config.mode) $("widgetMode").value = config.mode;
        if (config.level) $("widgetLevel").value = config.level;
        const pct = Math.round((config.alpha || 0.94) * 100);
        $("widgetAlpha").value = pct;
        $("widgetAlphaOut").textContent = pct + "%";
      };
      $("modalClose").addEventListener("click", closeModal);
      $("modalOverlay").addEventListener("click", event => {
        if (event.target === $("modalOverlay")) closeModal();
      });
      $("layerMenu").addEventListener("click", event => {
        const action = event.target.dataset.layerAction;
        if (action) handleLayerAction(action);
      });
      document.addEventListener("click", event => {
        if (!$("layerMenu").hidden && !$("layerMenu").contains(event.target) && !event.target.classList.contains("tab-more")) {
          closeLayerMenu();
        }
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          closeLayerMenu();
          closeModal();
        }
      });

      window.k20ReceiveKeymap = incoming => {
        const previousSelection = selectedId;
        keymap = incoming;
        if (!keymap.layers[layerIndex]) layerIndex = 0;
        if (!currentLayer().profiles[profileName]) profileName = "default";
        selectedId = previousSelection;
        $("status").textContent = "설정이 최신 상태입니다.";
        renderAll();
        if (selectedId) {
          const keyInfo = PHYSICAL_KEYS.find(info => info.id === selectedId);
          if (keyInfo) selectKey(selectedId, keyInfo.engraving);
        }
      };

      window.k20SelectKey = id => {
        if (!keymap) return false;
        const keyInfo = PHYSICAL_KEYS.find(info => info.id === id && !info.disabled && !info.switch);
        if (!keyInfo) return false;
        selectKey(keyInfo.id, keyInfo.engraving);
        return true;
      };

      document.addEventListener("DOMContentLoaded", () => bridge({ action: "load" }));
    })();
  </script>
</body>
</html>
